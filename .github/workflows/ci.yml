name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # No secrets on PRs: assembleRelease falls back to the committed debug key, so R8 breakage still fails the PR.
      - name: Check
        run: ./gradlew ktlintCheck lint testDebugUnitTest assembleDebug assembleRelease

      - uses: actions/upload-artifact@v7
        with:
          name: pie-launcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
